# Minimal Remio daemon + web UI deployment.
#
# Open http://localhost:7676 after `docker compose up -d`.
# For any network-reachable deployment, change REMIO_PASSWORD first.
services:
  remio:
    image: ghcr.io/getremio/remio:latest
    container_name: remio
    restart: unless-stopped
    ports:
      - "7676:7676"
    environment:
      REMIO_PASSWORD: "change-me"
      # Add DNS names you use to reach this container. IPs and localhost are
      # already allowed by default.
      # REMIO_HOSTNAMES: "remio.example.com,.lan"
    volumes:
      # Persistent daemon state and agent credentials/config.
      - ./remio-home:/home/remio
      # Code visible to Remio and the agents it launches.
      - ./workspace:/workspace
