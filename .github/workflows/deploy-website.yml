name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "public-docs/**"
      - "packages/website/**"
      - "packages/protocol/**"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - ".github/workflows/deploy-website.yml"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci --workspace=@getremio/website --workspace=@getremio/protocol --include-workspace-root

      - name: Build protocol
        run: npm run build:protocol

      - name: Typecheck
        run: npm run typecheck --workspace=@getremio/website

      - name: Build website
        run: npm run build --workspace=@getremio/website

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; skipping Cloudflare Workers deploy."
            exit 0
          fi
          npx --workspace=@getremio/website wrangler deploy
